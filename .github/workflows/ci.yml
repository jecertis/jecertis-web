name: CI

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'package.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'package.json'
      - '.github/workflows/ci.yml'

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: HTMLHint
        run: npx --yes htmlhint "**/*.html"

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,204,206,429 "**/*.html"
          fail: true
