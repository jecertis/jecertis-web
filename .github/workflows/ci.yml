name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTMLHint
        run: npx --yes htmlhint "**/*.html"

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,204,206,429 "**/*.html"
          fail: true
